name: Gerar APK - Ricardo Souza Collection

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Selecionar V50
        run: |
          ZIP_FILE="./000_Ricardo_Souza_Collection_Android_v50.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "V50 não encontrado."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Descompactar projeto
        run: |
          rm -rf projeto
          mkdir -p projeto
          unzip -q "$ZIP_FILE" -d projeto

      - name: Localizar projeto Android
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/projeto" -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Corrigir JVM para Java 17
        run: |
          cat >> "$PROJECT_DIR/app/build.gradle.kts" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Preparar chave permanente
        env:
          RSC_KEYSTORE_BASE64: ${{ secrets.RSC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RSC_KEYSTORE_BASE64" ]; then
            echo "Secret RSC_KEYSTORE_BASE64 não configurado."
            exit 1
          fi

          echo "$RSC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ricardo-collection-release.jks"

          echo "RSC_KEYSTORE_PATH=$RUNNER_TEMP/ricardo-collection-release.jks" >> "$GITHUB_ENV"
      - name: Corrigir sintaxe Kotlin
        run: |
          sed -i '129s/<= if (tt.length >= 7) 2 else 1/<= (if (tt.length >= 7) 2 else 1)/' "$PROJECT_DIR/app/src/main/java/com/ricardosouza/collection/network/MusicBrainzRepository.kt"

      - name: Compilar APK Release assinado
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          RSC_KEYSTORE_PATH: ${{ env.RSC_KEYSTORE_PATH }}
          RSC_KEYSTORE_PASSWORD: ${{ secrets.RSC_KEYSTORE_PASSWORD }}
          RSC_KEY_ALIAS: ${{ secrets.RSC_KEY_ALIAS }}
          RSC_KEY_PASSWORD: ${{ secrets.RSC_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Verificar assinatura
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK Release não encontrado."
            exit 1
          fi

          echo "APK encontrado: $APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Publicar APK assinado
        uses: actions/upload-artifact@v4
        with:
          name: Ricardo-Souza-Collection-APK-Assinado-V50
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
